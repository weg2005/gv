
name: Compilateur APK Kivy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. Récupérer le dépôt
      - name: Récupérer le projet
        uses: actions/checkout@v4

      # 2. Python hôte
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"
          cache: "pip"

      # 3. Java
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Dépendances Linux
      - name: Installer les dépendances
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libtool-bin \
            libltdl-dev gettext autopoint pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev \
            build-essential ccache patch \
            curl wget

      # 5. Installer des versions fixes des outils
      - name: Installer Buildozer et Cython
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install \
            "setuptools==69.5.1" \
            "wheel==0.43.0" \
            "buildozer==1.5.0" \
            "Cython==0.29.36"

          buildozer --version
          cython --version
          python --version

      # 6. Vérifier et extraire l'archive du projet
      - name: Extraire et nettoyer le projet
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f sql_stock.zip ]; then
            echo "ERREUR : sql_stock.zip est absent du dépôt."
            ls -la
            exit 1
          fi

          mkdir -p projet
          unzip -q sql_stock.zip -d projet

          # Éliminer les anciens environnements et caches
          find projet -type d \( \
            -name .buildozer -o \
            -name .git -o \
            -name __pycache__ -o \
            -name .venv -o \
            -name venv \
          \) -prune -exec rm -rf {} +

          find projet -type f \( \
            -name "*.pyc" -o \
            -name "*.pyo" \
          \) -delete

          # Repérer le véritable dossier de l'application
          if [ ! -f projet/main.py ]; then
            mapfile -t fichiers < <(
              find projet -maxdepth 4 -type f -name main.py
            )

            if [ "${#fichiers[@]}" -ne 1 ]; then
              echo "ERREUR : main.py absent ou ambigu."
              find projet -maxdepth 4 -type f
              exit 1
            fi

            dossier="$(dirname "${fichiers[0]}")"
            mkdir -p source_temp
            cp -a "$dossier"/. source_temp/
            rm -rf projet
            mv source_temp projet
          fi

          echo "Fichiers de l'application :"
          find projet -maxdepth 2 -type f | head -200

      # 7. Créer la configuration Buildozer
      - name: Créer buildozer.spec
        working-directory: projet
        run: |
          set -euo pipefail
          buildozer init

      # 8. Configurer l'application et les versions Android
      - name: Configurer Buildozer
        working-directory: projet
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("buildozer.spec")
          text = path.read_text()

          def set_value(key, value):
              global text
              pattern = rf"(?m)^\s*#?\s*{re.escape(key)}\s*=.*$"
              replacement = f"{key} = {value}"
              if re.search(pattern, text):
                  text = re.sub(pattern, replacement, text, count=1)
              else:
                  text += f"\n{replacement}\n"

          values = {
              "title": "Gestion Vente",
              "package.name": "gestionvente",
              "package.domain": "org.gestion",
              "source.dir": ".",
              "source.include_exts":
                  "py,png,jpg,jpeg,kv,atlas,db,ttf,txt,json",
              "source.exclude_dirs":
                  ".buildozer,.git,__pycache__,venv,.venv,tests,docs,bin",
              "version": "1.0.0",
              "orientation": "portrait",
              "fullscreen": "0",
              "requirements":
                  "python3==3.11.0,kivy==2.3.0",
              "android.api": "34",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "android.accept_sdk_license": "True",
              "android.build_tools_version": "34.0.0",
              "p4a.url":
                  "https://github.com/kivy/python-for-android",
              "p4a.branch": "v2024.01.21",
              "log_level": "2",
          }

          for key, value in values.items():
              set_value(key, value)

          # Garder les fichiers de l'application hors du répertoire
          # contenant les fichiers intermédiaires de compilation.
          if "[buildozer]" not in text:
              text += "\n[buildozer]\n"

          section = text.split("[buildozer]", 1)
          before = section[0]
          after = section[1]

          after = re.sub(
              r"(?m)^\s*#?\s*build_dir\s*=.*$\n?",
              "",
              after,
          )
          after = "\nbuild_dir = /tmp/buildozer_build\n" + after
          text = before + "[buildozer]" + after

          path.write_text(text)
          print(path.read_text())
          PY

      # 9. Vérifier les chemins avant compilation
      - name: Vérifier les sources
        working-directory: projet
        run: |
          set -euo pipefail

          test -f main.py
          test -f buildozer.spec

          if find . -type d -name .buildozer -print -quit |
             grep -q .; then
            echo "ERREUR : un .buildozer est présent dans les sources."
            exit 1
          fi

          echo "Répertoire source : $(pwd)"
          echo "Répertoire de compilation : /tmp/buildozer_build"

      # 10. Compiler
      - name: Compiler APK
        working-directory: projet
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: |
          set -o pipefail

          # Ne pas masquer les erreurs de compilation.
          buildozer -v android debug 2>&1 |
            tee "$GITHUB_WORKSPACE/compilation.log"

          # Vérifier que l'APK existe réellement.
          mkdir -p "$GITHUB_WORKSPACE/apk"
          find /tmp/buildozer_build projet/bin \
            -type f -name "*.apk" \
            -exec cp -v {} "$GITHUB_WORKSPACE/apk/" \; \
            2>/dev/null || true

          if ! find "$GITHUB_WORKSPACE/apk" \
              -maxdepth 1 -type f -name "*.apk" |
              grep -q .; then
            echo "ERREUR : aucun APK produit."
            exit 1
          fi

      # 11. Publier l'APK
      - name: Télécharger l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 7

      # 12. Conserver les logs même en cas d'échec
      - name: Récupérer les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-compilation
          path: compilation.log
          if-no-files-found: ignore
          retention-days: 7
          
