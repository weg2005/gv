
name: Compilateur APK Kivy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. Récupération du dépôt
      - name: Récupérer le projet
        uses: actions/checkout@v4

      # 2. Python hôte : aucun cache pip
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      # 3. Java 17
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Dépendances système
      - name: Installer les dépendances Linux
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            autoconf automake libtool libtool-bin \
            libltdl-dev gettext autopoint pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev \
            build-essential ccache patch

      # 5. Versions fixes des outils
      - name: Installer Buildozer et Cython
        run: |
          set -e
          python -m pip install "pip<24.1"
          python -m pip install \
            "setuptools==69.5.1" \
            "wheel==0.43.0" \
            "buildozer==1.5.0" \
            "Cython==0.29.36"

          python --version
          buildozer --version
          cython --version

      # 6. Extraction de l'application
      - name: Préparer les sources
        shell: bash
        run: |
          set -euo pipefail

          test -f sql_stock.zip || {
            echo "ERREUR : sql_stock.zip absent du dépôt."
            ls -la
            exit 1
          }

          mkdir projet
          unzip -q sql_stock.zip -d projet

          # Supprimer les anciens caches de compilation
          find projet -type d \( \
            -name .buildozer -o \
            -name .git -o \
            -name __pycache__ -o \
            -name .venv -o \
            -name venv -o \
            -name .pytest_cache \
          \) -prune -exec rm -rf {} +

          find projet -type f \( \
            -name "*.pyc" -o \
            -name "*.pyo" \
          \) -delete

          # Repérer main.py dans l'archive
          if [ ! -f projet/main.py ]; then
            mapfile -t mains < <(
              find projet -maxdepth 5 -type f -name main.py
            )

            if [ "${#mains[@]}" -ne 1 ]; then
              echo "ERREUR : main.py absent ou ambigu."
              find projet -maxdepth 5 -type f
              exit 1
            fi

            dossier="$(dirname "${mains[0]}")"
            mkdir source_temp
            cp -a "$dossier"/. source_temp/
            rm -rf projet
            mv source_temp projet
          fi

          test -f projet/main.py
          echo "Sources prêtes."
          find projet -maxdepth 2 -type f | head -200

      # 7. Configuration Buildozer
      - name: Créer buildozer.spec
        working-directory: projet
        run: |
          set -e
          buildozer init

      # 8. Configurer l'application
      - name: Configurer Buildozer
        working-directory: projet
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import configparser

          path = Path("buildozer.spec")
          cfg = configparser.ConfigParser(
              interpolation=None,
              strict=False
          )
          cfg.optionxform = str

          with path.open(encoding="utf-8") as f:
              cfg.read_file(f)

          app = cfg["app"]

          settings = {
              "title": "Gestion Vente",
              "package.name": "gestionvente",
              "package.domain": "org.gestion",
              "source.dir": ".",
              "source.include_exts":
                  "py,png,jpg,jpeg,kv,atlas,db,ttf,txt,json",
              "source.exclude_dirs":
                  ".buildozer,.git,__pycache__,venv,.venv,tests,docs",
              "version": "1.0.0",
              "orientation": "portrait",
              "fullscreen": "0",
              "requirements": "python3,kivy==2.3.0",
              "android.api": "34",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "android.accept_sdk_license": "True",
              "android.build_tools_version": "34.0.0",
              "p4a.url":
                  "https://github.com/kivy/python-for-android",
              "p4a.branch": "v2024.01.21",
          }

          app.update(settings)

          if not cfg.has_section("buildozer"):
              cfg.add_section("buildozer")

          cfg["buildozer"]["log_level"] = "2"
          cfg["buildozer"]["build_dir"] = "/tmp/buildozer_build"
          cfg["buildozer"]["bin_dir"] = "bin"

          with path.open("w", encoding="utf-8") as f:
              cfg.write(f)

          print("Configuration Buildozer créée.")
          PY

      # 9. Correctif TAR PAX sans sortie parasite
      - name: Préparer le correctif TAR
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/tar_patch"

          cat > "$GITHUB_WORKSPACE/tar_patch/sitecustomize.py" <<'PY'
          import tarfile

          original_tobuf = tarfile.TarInfo.tobuf

          def pax_tobuf(
              self,
              format=tarfile.DEFAULT_FORMAT,
              encoding=tarfile.ENCODING,
              errors="surrogateescape",
          ):
              if format == tarfile.USTAR_FORMAT:
                  format = tarfile.PAX_FORMAT

              return original_tobuf(
                  self, format, encoding, errors
              )

          tarfile.TarInfo.tobuf = pax_tobuf
          PY

          echo "Correctif TAR préparé."

      # 10. Compilation et capture exacte du code retour
      - name: Compiler APK
        working-directory: projet
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: |
          set -uo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/tar_patch${PYTHONPATH:+:$PYTHONPATH}"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          buildozer -v android debug 2>&1 |
            tee "$GITHUB_WORKSPACE/compilation.log"

          result=${PIPESTATUS[0]}

          if [ "$result" -ne 0 ]; then
            echo "ÉCHEC DE BUILDOZER : code $result"
            exit "$result"
          fi

          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" \
              -exec cp -v {} "$GITHUB_WORKSPACE/apk/" \;
          fi

          if ! find "$GITHUB_WORKSPACE/apk" \
              -maxdepth 1 -type f -name "*.apk" |
              grep -q .; then
            echo "ERREUR : aucun APK n'a été produit."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/apk"

      # 11. Télécharger l'APK
      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 7

      # 12. Conserver les journaux même en cas d'échec
      - name: Publier les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-compilation
          path: compilation.log
          if-no-files-found: ignore
          retention-days: 7
          
