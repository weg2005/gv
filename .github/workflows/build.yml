
name: Compilateur APK Kivy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # 1. Récupérer le dépôt
      - name: Récupérer le projet
        uses: actions/checkout@v4

      # 2. Installer Python sans cache pip
      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      # 3. Installer Java
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 4. Dépendances Linux
      - name: Installer les dépendances Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            autoconf automake libtool libtool-bin \
            libltdl-dev gettext autopoint pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev \
            build-essential ccache patch

      # 5. Installer les outils avec versions fixes
      - name: Installer Buildozer et Cython
        run: |
          python -m pip install "pip<24.1"
          python -m pip install \
            "setuptools==69.5.1" \
            "wheel==0.43.0" \
            "buildozer==1.5.0" \
            "Cython==0.29.36"

          python --version
          buildozer --version
          cython --version

      # 6. Extraire et nettoyer le projet
      - name: Préparer les sources
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f sql_stock.zip ]; then
            echo "ERREUR : sql_stock.zip est absent du dépôt."
            ls -la
            exit 1
          fi

          mkdir -p projet
          unzip -q sql_stock.zip -d projet

          # Éliminer les caches et anciennes compilations
          find projet -type d \( \
            -name .buildozer -o \
            -name .git -o \
            -name __pycache__ -o \
            -name .venv -o \
            -name venv -o \
            -name .pytest_cache \
          \) -prune -exec rm -rf {} +

          find projet -type f \( \
            -name "*.pyc" -o \
            -name "*.pyo" \
          \) -delete

          # Repérer main.py dans l'archive
          if [ ! -f projet/main.py ]; then
            mapfile -t mains < <(
              find projet -maxdepth 5 -type f -name main.py
            )

            if [ "${#mains[@]}" -ne 1 ]; then
              echo "ERREUR : main.py absent ou ambigu."
              find projet -maxdepth 5 -type f
              exit 1
            fi

            dossier="$(dirname "${mains[0]}")"
            mkdir -p source_temp
            cp -a "$dossier"/. source_temp/
            rm -rf projet
            mv source_temp projet
          fi

          test -f projet/main.py

          echo "Sources détectées :"
          find projet -maxdepth 2 -type f | head -200

      # 7. Générer la configuration Buildozer
      - name: Créer buildozer.spec
        working-directory: projet
        run: |
          set -euo pipefail
          buildozer init

      # 8. Configurer l'application
      - name: Configurer Buildozer
        working-directory: projet
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import configparser
          from pathlib import Path

          path = Path("buildozer.spec")
          config = configparser.ConfigParser(
              interpolation=None,
              strict=False
          )
          config.optionxform = str

          with path.open(encoding="utf-8") as f:
              config.read_file(f)

          app = config["app"]

          values = {
              "title": "Gestion Vente",
              "package.name": "gestionvente",
              "package.domain": "org.gestion",
              "source.dir": ".",
              "source.include_exts":
                  "py,png,jpg,jpeg,kv,atlas,db,ttf,txt,json",
              "source.exclude_dirs":
                  ".buildozer,.git,__pycache__,venv,.venv,tests,docs",
              "version": "1.0.0",
              "orientation": "portrait",
              "fullscreen": "0",
              "requirements": "python3,kivy==2.3.0",
              "android.api": "34",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "android.accept_sdk_license": "True",
              "android.build_tools_version": "34.0.0",
              "p4a.url":
                  "https://github.com/kivy/python-for-android",
              "p4a.branch": "v2024.01.21",
          }

          app.update(values)

          if not config.has_section("buildozer"):
              config.add_section("buildozer")

          config["buildozer"]["log_level"] = "2"
          config["buildozer"]["warn_on_root"] = "0"
          config["buildozer"]["build_dir"] = "/tmp/buildozer_build"
          config["buildozer"]["bin_dir"] = "bin"

          with path.open("w", encoding="utf-8") as f:
              config.write(f)

          print(path.read_text())
          PY

      # 9. Corriger le format TAR sans modifier tarfile.py
      - name: Préparer le correctif PAX
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/tar_patch"

          cat > "$GITHUB_WORKSPACE/tar_patch/sitecustomize.py" <<'PY'
          import tarfile

          _original_tobuf = tarfile.TarInfo.tobuf

          def _pax_tobuf(self, format, encoding, errors):
              if format == tarfile.USTAR_FORMAT:
                  format = tarfile.PAX_FORMAT

              return _original_tobuf(
                  self, format, encoding, errors
              )

          tarfile.TarInfo.tobuf = _pax_tobuf

          print(
              "Correctif TAR PAX activé pour les archives USTAR",
              flush=True
          )
          PY

          export PYTHONPATH="$GITHUB_WORKSPACE/tar_patch${PYTHONPATH:+:$PYTHONPATH}"

          python - <<'PY'
          import tarfile
          import sys

          assert tarfile.TarInfo.tobuf is not None
          print("Python :", sys.version)
          print("tarfile :", tarfile.__file__)
          print("PAX :", tarfile.PAX_FORMAT)
          PY

      # 10. Compiler l'APK
      - name: Compiler APK
        working-directory: projet
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: |
          set -uo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/tar_patch${PYTHONPATH:+:$PYTHONPATH}"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          buildozer -v android debug 2>&1 |
            tee "$GITHUB_WORKSPACE/compilation.log"

          result=${PIPESTATUS[0]}

          if [ "$result" -ne 0 ]; then
            echo "ÉCHEC : Buildozer a retourné le code $result."
            exit "$result"
          fi

          # Chercher l'APK généré
          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" \
              -exec cp -v {} "$GITHUB_WORKSPACE/apk/" \;
          fi

          if ! find "$GITHUB_WORKSPACE/apk" \
              -maxdepth 1 -type f -name "*.apk" |
              grep -q .; then
            echo "ERREUR : compilation terminée sans APK détecté."
            exit 1
          fi

          echo "APK produit :"
          ls -lh "$GITHUB_WORKSPACE/apk"

      # 11. Publier l'APK
      - name: Récupérer l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 7

      # 12. Publier les logs même si la compilation échoue
      - name: Récupérer les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-compilation
          path: compilation.log
          if-no-files-found: ignore
          retention-days: 7
          
