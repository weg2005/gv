name: Compilateur APK Kivy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.11"

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer les dépendances Linux
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip curl wget \
            autoconf automake libtool libtool-bin \
            libltdl-dev gettext autopoint pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            libsqlite3-dev libbz2-dev \
            build-essential ccache patch

      - name: Installer Buildozer et Cython
        run: |
          set -e
          python -m pip install "pip<24.1"
          python -m pip install \
            "setuptools==69.5.1" \
            "wheel==0.43.0" \
            "buildozer==1.5.0" \
            "Cython==0.29.36"

          python --version
          buildozer --version
          cython --version

      - name: Préparer les sources
        shell: bash
        run: |
          set -euo pipefail

          test -f sql_stock.zip || {
            echo "ERREUR : sql_stock.zip absent du dépôt."
            ls -la
            exit 1
          }

          rm -rf projet
          mkdir -p projet
          unzip -q sql_stock.zip -d projet

          find projet -type d \( \
            -name .buildozer -o \
            -name .git -o \
            -name __pycache__ -o \
            -name .venv -o \
            -name venv -o \
            -name .pytest_cache \
          \) -prune -exec rm -rf {} +

          find projet -type f \( \
            -name "*.pyc" -o \
            -name "*.pyo" \
          \) -delete

          if [ ! -f projet/main.py ]; then
            mapfile -t mains < <(
              find projet -maxdepth 5 -type f -name main.py
            )

            if [ "${#mains[@]}" -ne 1 ]; then
              echo "ERREUR : main.py absent ou ambigu."
              find projet -maxdepth 5 -type f
              exit 1
            fi

            dossier="$(dirname "${mains[0]}")"
            rm -rf source_temp
            mkdir -p source_temp
            cp -a "$dossier"/. source_temp/
            rm -rf projet
            mv source_temp projet
          fi

          test -f projet/main.py
          echo "Sources prêtes."
          find projet -maxdepth 2 -type f | head -200

      - name: Raccourcir les noms de fichiers trop longs
        shell: bash
        run: |
          set -euo pipefail
          echo "Vérification des noms de fichiers > 90 caractères..."
          find projet -type f | while read -r filepath; do
            filename=$(basename "$filepath")
            dirpath=$(dirname "$filepath")
            if [ ${#filename} -gt 90 ]; then
              ext="${filename##*.}"
              base="${filename%.*}"
              new_filename="${base:0:60}_short.${ext}"
              mv "$filepath" "$dirpath/$new_filename"
              echo "Renommé : $filename -> $new_filename"
            fi
          done

      - name: Créer buildozer.spec
        working-directory: projet
        run: |
          set -e
          buildozer init

      - name: Configurer Buildozer
        working-directory: projet
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import configparser

          path = Path("buildozer.spec")
          cfg = configparser.ConfigParser(
              interpolation=None,
              strict=False
          )
          cfg.optionxform = str

          with path.open(encoding="utf-8") as f:
              cfg.read_file(f)

          app = cfg["app"]

          settings = {
              "title": "Gestion Vente",
              "package.name": "wilfried",
              "package.domain": "org.wilfried",
              "source.dir": ".",
              "source.include_exts":
                  "py,png,jpg,jpeg,kv,atlas,db,ttf,txt,json",
              "source.exclude_dirs":
                  ".buildozer,.git,__pycache__,venv,.venv,tests,docs",
              "version": "1.0.0",
              "orientation": "portrait, landscape",
              "fullscreen": "0",
              "requirements": "python3,kivy==2.3.0,fpdf,numpy,pandas,matplotlib==3.5.3",
              
              "android.api": "34",
              "android.minapi": "24",
              "android.ndk": "25b",
              "android.ndk_api": "24",
              "android.archs": "arm64-v8a",
              "android.accept_sdk_license": "True",
              "android.build_tools_version": "34.0.0",
              "p4a.url":
                  "https://github.com/kivy/python-for-android",
              "p4a.branch": "v2024.01.21",
          }

          app.update(settings)

          if not cfg.has_section("buildozer"):
              cfg.add_section("buildozer")

          cfg["buildozer"]["log_level"] = "2"

          with path.open("w", encoding="utf-8") as f:
              cfg.write(f)

          print("Configuration Buildozer créée.")
          PY

      - name: Corriger TAR name too long
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/tar_patch"

          cat > "$GITHUB_WORKSPACE/tar_patch/sitecustomize.py" <<'PY'
          import tarfile

          # Forcer le format global par défaut à PAX
          tarfile.DEFAULT_FORMAT = tarfile.PAX_FORMAT

          # Intercepter proprement la création d'en-tête ustar pour basculer en PAX en cas de dépassement
          _original_create_ustar = tarfile.TarInfo.create_ustar_header

          def _safe_create_ustar(self, info, encoding, errors):
              try:
                  return _original_create_ustar(self, info, encoding, errors)
              except ValueError as e:
                  if "name is too long" in str(e):
                      return self.create_pax_header(info, encoding, errors)
                  raise

          tarfile.TarInfo.create_ustar_header = _safe_create_ustar
          PY

          echo "Correctif TAR PAX sécurisé appliqué."
          
      - name: Compiler APK
        working-directory: projet
        shell: bash
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
          SETUPTOOLS_USE_DISTUTILS: stdlib
        run: |
          set -uo pipefail

          export PYTHONPATH="$GITHUB_WORKSPACE/tar_patch${PYTHONPATH:+:$PYTHONPATH}"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          buildozer -v android debug 2>&1 |
            tee "$GITHUB_WORKSPACE/compilation.log"

          result=${PIPESTATUS[0]}

          if [ "$result" -ne 0 ]; then
            echo "ÉCHEC DE BUILDOZER : code $result"
            exit "$result"
          fi

          if [ -d bin ]; then
            find bin -maxdepth 1 -type f -name "*.apk" \
              -exec cp -v {} "$GITHUB_WORKSPACE/apk/" \;
          fi

          if ! find "$GITHUB_WORKSPACE/apk" \
              -maxdepth 1 -type f -name "*.apk" |
              grep -q .; then
            echo "ERREUR : aucun APK n'a été produit."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/apk"

      - name: Publier l'APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: gestion-vente-apk
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publier les journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-compilation
          path: compilation.log
          if-no-files-found: ignore
          retention-days: 7
          
